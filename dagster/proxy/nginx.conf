# Reverse proxy authentifiant devant Dagster.
#
# Dagster (edition open source) n'a AUCUNE authentification : qui atteint son
# port peut lancer un job, donc executer du code arbitraire sur la machine.
# Publier son port 3000 revenait a ouvrir cette porte a tout le reseau local.
# Le port 3000 de l'hote arrive maintenant ici ; celui de codelab-dagster
# n'est plus publie et n'est joignable que depuis le reseau interne de la
# stack.

# "Connection: upgrade" seulement quand le client le demande, "close" sinon.
# Poser la valeur en dur casserait les requetes HTTP ordinaires. Ce fichier
# est dans le contexte "http" (conf.d), le seul ou "map" est accepte ;
# mailpit.conf s'en sert aussi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    # Dagster televerse et telecharge des artefacts : la valeur par defaut
    # (1 Mo) rejetterait des requetes parfaitement legitimes.
    client_max_body_size 100m;

    # ------------------------- authentification -------------------------
    #
    # Dagster hérite de la SESSION DU PANNEAU, au lieu d'avoir son propre mot
    # de passe en HTTP Basic. Ce qui a change et pourquoi :
    #
    #   - HTTP Basic n'a aucune session. Pas d'expiration, pas de
    #     deconnexion, et le navigateur renvoie les identifiants a chaque
    #     requete jusqu'a la fermeture complete du navigateur.
    #   - Sa fenetre est celle du navigateur : impossible a habiller, et
    #     l'interface deja chargee reste visible derriere pendant qu'elle
    #     s'affiche.
    #   - Cela faisait un deuxieme mot de passe a retenir pour la meme
    #     personne, sans second facteur.
    #
    # Desormais : nginx interroge le panneau avant chaque requete, et renvoie
    # vers sa page de connexion si la session manque. Le visiteur quitte donc
    # la page -- plus rien de Dagster ne reste a l'ecran.
    #
    # Le cookie de session traverse : la portee d'un cookie ignore le numero
    # de port, celui pose sur :9001 est donc envoye a :3000. Et "SameSite=Lax"
    # laisse passer une navigation de premier niveau, ce qu'est cette
    # redirection.
    # Sonde du healthcheck Docker. Hors de "location /", donc sans
    # auth_request : elle prouve que nginx est debout et que sa configuration
    # s'est chargee. Elle ne peut plus prouver que l'authentification tient,
    # comme le faisait l'attente d'un 401 : une requete non authentifiee
    # redirige desormais vers le panneau, et le client du healthcheck suit la
    # redirection vers un hote qui n'existe pas dans ce conteneur.
    location = /_sante {
        access_log off;
        return 200 "ok\n";
    }

    location = /_auth {
        internal;
        proxy_pass http://$panneau/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # DAGSTER TOMBE : ON EXPLIQUE, AU LIEU DE RENDRE « 502 Bad Gateway ».
    #
    # Le 502 de nginx est exact et inutilisable : il ne dit ni qui ne repond
    # pas -- le proxy va tres bien, c'est l'amont qui est muet -- ni quoi
    # faire. La page ci-dessous le dit, et donne la commande a taper.
    #
    # Le code reste 502 (ou 504) : un client qui n'est pas un navigateur doit
    # continuer a voir une erreur, pas une page d'explication rendue en 200.
    error_page 502 503 504 /_indisponible.html;

    location = /_indisponible.html {
        internal;
        root /usr/share/nginx/codelab;
        # La page est servie a la place d'une erreur : personne ne doit la
        # garder en cache et croire Dagster mort apres son retour.
        add_header Cache-Control "no-store" always;
    }

    # Panne du panneau : la requete d'autorisation echoue, nginx rend 500 et
    # l'acces reste ferme. C'est le bon sens de defaillance -- mieux vaut
    # Dagster injoignable qu'ouvert a tous.
    error_page 401 = @connexion;

    location @connexion {
        return 302 $schema_public://$host:9001/login;
    }

    # Le DNS interne de Docker, pour les reseaux definis par l'utilisateur
    # (celui du compose en est un). Necessaire des lors que l'adresse amont
    # passe par une variable, ci-dessous.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Meme raison que pour l'amont Dagster : passer par une variable evite
    # que nginx fige l'adresse du panneau au chargement de la configuration.
    set $panneau codelab-app-manager:9001;

    # http en clair par defaut ; derriere un reverse proxy qui termine du TLS,
    # l'en-tete dit "https" et la redirection suit.
    set $schema_public $http_x_forwarded_proto;
    if ($schema_public = "") { set $schema_public "http"; }

    # L'ICONE D'ONGLET EST CELLE DE CODELAB. Safari range les icones par nom
    # d'hote, sans le port : Dagster (3000) partage celui du panneau (9001),
    # et son icone pouvait reprendre l'onglet du panneau. Toutes ses
    # adresses d'icone (favicon.svg, favicon.png, celles qui disent l'etat
    # d'un run...) rendent donc le logo CodeLab. Hors authentification :
    # une image, rien de l'installation.
    location ~ ^/favicon[-a-z0-9_]*\.svg$ {
        alias /usr/share/nginx/codelab/mailpit/codelab.svg;
        default_type image/svg+xml;
        types { }
        add_header Cache-Control "no-cache" always;
        access_log off;
    }
    location ~ ^/(favicon[-a-z0-9_]*\.(png|ico)|apple-touch-icon[-a-z0-9]*\.png)$ {
        alias /usr/share/nginx/codelab/mailpit/codelab.png;
        default_type image/png;
        types { }
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location / {
        auth_request /_auth;

        # Nom d'hote dans une VARIABLE, et non ecrit directement dans
        # proxy_pass. Deux raisons, dont la seconde est la vraie :
        #
        #   - avec un nom litteral, nginx resout l'adresse au CHARGEMENT de
        #     la configuration : "nginx -t" echoue partout ou codelab-dagster
        #     n'existe pas, notamment au build de l'image ;
        #   - surtout, il la FIGE alors pour la duree de vie du processus. Un
        #     "docker restart codelab-dagster" -- le geste meme que la
        #     documentation recommande pour recharger le code -- change son
        #     adresse, et le proxy continuerait de parler dans le vide
        #     jusqu'a ce qu'on le redemarre lui aussi.
        #
        # Avec une variable, la resolution a lieu a chaque requete, via le
        # resolver ci-dessus. Pas d'URI apres le port : l'URI d'origine est
        # transmise telle quelle.
        set $amont codelab-dagster;
        proxy_pass http://$amont:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'interface de Dagster suit les runs par websocket (souscriptions
        # GraphQL). Sans ces trois lignes, la page s'affiche mais les
        # journaux d'execution restent figes -- une panne d'autant plus
        # deroutante que le reste fonctionne.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Un run peut rester silencieux longtemps : sans ces delais, nginx
        # coupe la connexion au bout d'une minute et l'interface se
        # reconnecte en boucle.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Les reponses en flux (journaux) doivent arriver au fil de l'eau,
        # pas par blocs une fois le tampon plein.
        proxy_buffering off;

        # ------------------------ LE RUBAN DE RETOUR ------------------------
        # Dagster conserve sa propre interface et ses websockets. On ajoute
        # seulement un lien de retour vers le hub CodeLab, sans faire transiter
        # Dagster par le proxy applicatif du panneau. C'est LE MEME ruban que
        # celui des applications, replie au bord de l'ecran : la feuille est
        # RUBAN_CSS (app-manager/app/serveur/13), recopiee telle quelle -- un
        # test les tient identiques.
        sub_filter '</body>' '<style>#codelab-ruban{all:initial;position:fixed;left:var(--codelab-bord-gauche, 0px);bottom:calc(14px + var(--codelab-bord-bas, 0px));z-index:2147483647;display:flex;align-items:center}#codelab-ruban>summary{all:initial;display:flex;align-items:center;justify-content:center;width:30px;height:46px;color:#fff;background:#141a21;border-radius:0 999px 999px 0;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.28);list-style:none}#codelab-ruban>summary::-webkit-details-marker{display:none}#codelab-ruban>summary::marker{content:""}#codelab-ruban>summary>span{all:initial;color:#fff;font:600 26px/1 sans-serif;cursor:pointer}#codelab-ruban[open]>summary{display:none}#codelab-retour-hub{all:initial;display:inline-flex;align-items:center;gap:8px;margin-left:14px;padding:11px 16px;font:600 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:#141a21;border-radius:999px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.28);text-decoration:none}#codelab-retour-hub>span{all:initial;color:#fff;cursor:pointer;font:600 14px/1 -apple-system,BlinkMacSystemFont,sans-serif}#codelab-retour-hub>span:first-child{font:600 17px/1 sans-serif}#codelab-ruban>summary:focus-visible,#codelab-retour-hub:focus-visible{outline:2px solid #4c8eff;outline-offset:2px}</style><details id="codelab-ruban"><summary title="CodeLab" aria-label="Afficher le bouton CodeLab"><span>&#8250;</span></summary><a href="$schema_public://$host:9001/" target="_top" id="codelab-retour-hub" title="Revenir au hub CodeLab"><span>&#8592;</span><span>CodeLab</span></a></details><script>(function(){try{var d=document.getElementById("codelab-ruban"),t=null;d.addEventListener("toggle",function(){clearTimeout(t);if(d.open){t=setTimeout(function(){d.open=false;},10000);}});}catch(e){}})();</script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
        proxy_set_header Accept-Encoding "";
    }
}
