# Mailpit derriere la session d'administration du panneau, sur le port 8025.
#
# L'interface de Mailpit montre TOUS les mails envoyes par les applications,
# liens de reinitialisation de mot de passe compris : elle est reservee a
# l'administrateur, exactement comme Dagster (meme /api/auth-check).
#
# Mailpit exige de son cote un mot de passe sur toute son API -- sans quoi
# les applications, qui partagent son reseau, pourraient la lire. nginx
# l'ajoute ici, APRES l'autorisation du panneau : l'en-tete vient de
# /etc/nginx/codelab/mailpit-auth.conf, ecrit par l'entrypoint.
server {
    listen 8025;
    server_name _;

    client_max_body_size 30m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $panneau codelab-app-manager:9001;

    set $schema_public $http_x_forwarded_proto;
    if ($schema_public = "") { set $schema_public "http"; }

    location = /_auth {
        internal;
        proxy_pass http://$panneau/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    error_page 401 = @connexion;

    location @connexion {
        return 302 $schema_public://$host:9001/login;
    }

    # L'habillage CodeLab (voir mailpit-theme/) : feuille de style, police et
    # logo, servis par ce proxy et non par Mailpit. Hors authentification :
    # ce ne sont que des fichiers statiques, sans rien de l'installation. La
    # meme origine que Mailpit, donc admis par sa politique de securite
    # (style-src et font-src 'self').
    location /_codelab/ {
        alias /usr/share/nginx/codelab/mailpit/;
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
    }
    # Le logo de Mailpit dans sa barre, et son icone d'onglet : les notres.
    location = /mailpit.svg {
        alias /usr/share/nginx/codelab/mailpit/logo.svg;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }
    location = /favicon.svg {
        alias /usr/share/nginx/codelab/mailpit/logo.svg;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }
    # Les deux usages ou Mailpit veut une image matricielle : l'icone des
    # notifications du navigateur, et favicon.ico pour qui la demande en
    # direct. Le meme logo, rendu en PNG (les navigateurs lisent un PNG servi
    # sous .ico).
    location = /notification.png {
        alias /usr/share/nginx/codelab/mailpit/logo.png;
        access_log off;
    }
    location = /favicon.ico {
        alias /usr/share/nginx/codelab/mailpit/logo.png;
        default_type image/png;
        types { }
        access_log off;
    }

    location / {
        auth_request /_auth;

        set $amont codelab-mailpit;
        proxy_pass http://$amont:8025;

        include /etc/nginx/codelab/mailpit-auth.conf;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La liste des mails se met a jour par websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        # Le ruban de retour vers le hub, le meme que sur Dagster : la tuile
        # ouvre Mailpit dans l'onglet courant.
        # LE LOGO PAR DES ADRESSES A NOUS, VERSIONNEES. Mailpit sert
        # /mailpit.svg et /favicon.svg avec « max-age=31536000, immutable » :
        # un navigateur qui les a vus une fois garde l'ANCIEN logo un an, sans
        # jamais redemander -- Ctrl+Maj+R compris. Les remplacer a la meme
        # adresse (ci-dessus) ne suffit donc pas : l'onglet pointe desormais
        # vers /_codelab/logo.svg?v=..., et la feuille de style peint le logo
        # de la barre par-dessus l'image de Mailpit. Changer le logo = changer
        # « v= » ici et dans mailpit.css.
        sub_filter 'href="/favicon.svg"' 'href="/_codelab/logo.svg?v=3"';
        sub_filter '</head>' '<link rel="stylesheet" href="/_codelab/mailpit.css?v=3"></head>';
        sub_filter '</body>' '<a href="$schema_public://$host:9001/" id="codelab-retour-hub" title="Revenir au hub CodeLab" style="all:initial;position:fixed;left:14px;bottom:14px;z-index:2147483647;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;font:600 13px/1 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#fff;background:#141a21;border-radius:999px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.28);text-decoration:none"><span style="all:initial;color:#fff;font:600 15px/1 sans-serif">&#8592;</span><span style="all:initial;color:#fff;font:600 13px/1 -apple-system,BlinkMacSystemFont,sans-serif">CodeLab</span></a></body>';
        sub_filter_once on;
        sub_filter_types text/html;
        proxy_set_header Accept-Encoding "";
    }
}
