# Mailpit derriere la session d'administration du panneau, sur le port 8025.
#
# L'interface de Mailpit montre TOUS les mails envoyes par les applications,
# liens de reinitialisation de mot de passe compris : elle est reservee a
# l'administrateur, exactement comme Dagster (meme /api/auth-check).
#
# L'INTERFACE EST CELLE DE CODELAB (mailpit-ui/), construite sur l'API
# publique de Mailpit. Mailpit garde, relaie et analyse les mails ; sa propre
# page n'est plus servie. Ce proxy sert donc :
#   /  et  /message/<id>    la page de CodeLab (statique, derriere la session) ;
#   /_codelab/...           ses fichiers (script, style, police, logos) ;
#   tout le reste           Mailpit lui-meme : /api/v1/..., /api/events (le
#                           direct, en websocket), /view/<id>.html (l'apercu).
#
# Mailpit exige de son cote un mot de passe sur toute son API -- sans quoi
# les applications, qui partagent son reseau, pourraient la lire. nginx
# l'ajoute ici, APRES l'autorisation du panneau : l'en-tete vient de
# /etc/nginx/codelab/mailpit-auth.conf, ecrit par l'entrypoint.
server {
    listen 8025;
    server_name _;

    client_max_body_size 30m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $panneau codelab-app-manager:9001;

    set $schema_public $http_x_forwarded_proto;
    if ($schema_public = "") { set $schema_public "http"; }

    location = /_auth {
        internal;
        proxy_pass http://$panneau/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    error_page 401 = @connexion;

    location @connexion {
        return 302 $schema_public://$host:9001/login;
    }

    # La page de CodeLab. Statique, mais derriere la session : personne
    # d'autre que l'administrateur n'a a la voir. Sa politique de securite
    # n'admet que ses propres fichiers -- aucun script en ligne, aucun style
    # en ligne, aucune origine tierce. Le HTML d'un mail ne s'y affiche que
    # dans un cadre isole (sandbox sans scripts), servi par Mailpit.
    location ~ ^/(message/[A-Za-z0-9]+)?$ {
        auth_request /_auth;
        root /usr/share/nginx/codelab/mailpit;
        try_files /index.html =404;
        default_type text/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }
    # Les anciennes adresses de la page de Mailpit menent a la notre.
    location ~ ^/view/([A-Za-z0-9]+)$ {
        return 302 /message/$1;
    }
    location = /search {
        return 302 /;
    }

    # Les fichiers de la page : script, style, police, logos. Hors
    # authentification : rien de l'installation, que du code public. Les
    # adresses sont versionnees (?v=) dans index.html.
    location /_codelab/ {
        alias /usr/share/nginx/codelab/mailpit/;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # L'ONGLET DE MAILPIT PORTE SON ICONE, et elle n'a qu'UNE adresse :
    # /mailpit-onglet.png, que seule la page de Mailpit declare. Choix fait en
    # connaissance de cause : Safari range les icones par nom d'hote, sans le
    # port, et peut reprendre celle-ci dans l'onglet du panneau (meme hote,
    # port 9001). Pour lui en laisser le moins possible :
    #   - toutes les adresses d'icone qu'un navigateur essaie de lui-meme
    #     (favicon.*, apple-touch-icon*) rendent le logo CodeLab ;
    #   - celles que l'ancienne page de Mailpit utilisait (/mailpit.svg,
    #     /notification.png, /favicon.svg) aussi.
    location ~ ^/(favicon\.svg|mailpit\.svg)$ {
        alias /usr/share/nginx/codelab/mailpit/codelab.svg;
        default_type image/svg+xml;
        types { }
        add_header Cache-Control "no-cache" always;
        access_log off;
    }
    location = /mailpit-onglet.png {
        alias /usr/share/nginx/codelab/mailpit/logo.png;
        default_type image/png;
        types { }
        add_header Cache-Control "no-cache" always;
        access_log off;
    }
    location ~ ^/(favicon\.ico|favicon\.png|icone-codelab\.png|codelab-onglet\.png|notification\.png|apple-touch-icon[-a-z0-9]*\.png)$ {
        alias /usr/share/nginx/codelab/mailpit/codelab.png;
        default_type image/png;
        types { }
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # Mailpit : l'API, le direct (websocket), l'apercu des messages.
    location / {
        auth_request /_auth;

        set $amont codelab-mailpit;
        proxy_pass http://$amont:8025;

        include /etc/nginx/codelab/mailpit-auth.conf;
        # $http_host, PORT COMPRIS. Mailpit n'accepte le websocket du direct
        # que si l'origine de la page (hote:8025) est egale a l'en-tete Host :
        # avec $host, sans le port, il le refusait (403) et le direct ne
        # marchait pas -- la page de Mailpit d'origine comprise.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le direct passe par websocket (/api/events).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
