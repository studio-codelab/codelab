<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f1f3; --bg-input:#f0f1f3;
  --line:#e2e4e8; --line2:#d7dae0; --txt:#1c2129; --dim:#5b6472; --dim2:#8891a0;
  --accent:#316dca; --accent-h:#2a5fb0; --accent-ring:rgba(49,109,202,.18);
  --ok:#1a7f37; --ok-bg:rgba(26,127,55,.1); --ok-border:rgba(26,127,55,.3);
  --err:#cf222e; --err-bg:rgba(207,34,46,.08); --err-txt:#a4030f; --err-border:rgba(207,34,46,.28);
  --shadow:rgba(28,33,41,.08); --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2129; --bg-input:#0d1117;
    --line:#262c36; --line2:#30363d; --txt:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
    --accent:#4c8eff; --accent-h:#3d7dda; --accent-ring:rgba(76,142,255,.22);
    --ok:#3fb950; --ok-bg:rgba(63,185,80,.1); --ok-border:rgba(63,185,80,.35);
    --err:#f85149; --err-bg:rgba(248,81,73,.1); --err-txt:#ff9b95; --err-border:rgba(248,81,73,.35);
    --shadow:rgba(1,4,9,.6);
  }
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2129; --bg-input:#0d1117;
  --line:#262c36; --line2:#30363d; --txt:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
  --accent:#4c8eff; --accent-h:#3d7dda; --accent-ring:rgba(76,142,255,.22);
  --ok:#3fb950; --ok-bg:rgba(63,185,80,.1); --ok-border:rgba(63,185,80,.35);
  --err:#f85149; --err-bg:rgba(248,81,73,.1); --err-txt:#ff9b95; --err-border:rgba(248,81,73,.35);
  --shadow:rgba(1,4,9,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; transition:background .15s,color .15s}

body{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:340px;padding:32px 28px;background:var(--surface);
 border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.brand span{font-size:15px;font-weight:600}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line2);
 background:var(--bg-input);color:var(--txt);font:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
button{width:100%;margin-top:16px;padding:10px;border:none;border-radius:8px;
 background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:var(--accent-h)}
button:disabled{opacity:.6;cursor:default}
.err{margin-top:12px;padding:9px 12px;border-radius:8px;font-size:12.5px;
 background:var(--err-bg);color:var(--err-txt);border:1px solid var(--err-border);display:none}
.hint{margin-top:18px;font-size:11.5px;color:var(--dim2);line-height:1.5}
code{font-family:ui-monospace,Menlo,monospace;background:var(--bg-input);padding:1px 5px;border-radius:4px}
</style></head><body>
<div class="card">
  <div class="brand"><div class="dot"></div><span>CodeLab</span></div>
  <label>Mot de passe</label>
  <input type="password" id="pw" autofocus autocomplete="current-password">
  <div id="totp-bloc" style="display:none">
    <label style="margin-top:14px">Code de verification</label>
    <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="123456">
  </div>
  <button id="go" onclick="submit()">Se connecter</button>
  <div class="err" id="err"></div>
  <div class="hint">Mot de passe genere automatiquement au premier demarrage. Tous les identifiants CodeLab sont regroupes dans un seul fichier :
  <br><code>cat /DATA/AppData/codelab/config/credentials.env</code></div>
</div>
<script>
const pw=document.getElementById('pw'), err=document.getElementById('err'), go=document.getElementById('go');
const code=document.getElementById('code');
/* __TOTP__ est remplace par "1" ou "0" au moment de servir la page : le champ
   du code n'apparait que si la double authentification est active. */
const avecCode = '__TOTP__' === '1';
if(avecCode) document.getElementById('totp-bloc').style.display='block';

async function submit(){
  err.style.display='none'; go.disabled=true; go.textContent='Connexion...';
  try{
    const corps={password:pw.value};
    if(avecCode) corps.code=code.value;
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(corps)});
    const d=await r.json();
    if(r.ok){ location.href='/'; return; }
    err.textContent=d.error||'Erreur.'; err.style.display='block';
    if(d.totp && code) code.focus();
  }catch(e){ err.textContent='Erreur reseau.'; err.style.display='block'; }
  go.disabled=false; go.textContent='Se connecter';
}
const valider=e=>{ if(e.key==='Enter') submit(); };
pw.addEventListener('keydown', valider);
if(code) code.addEventListener('keydown', valider);
</script>
</body></html>
