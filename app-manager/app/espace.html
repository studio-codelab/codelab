<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeLab &middot; Mes projets</title>
<style>

:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f1f3; --bg-input:#f0f1f3;
  --line:#e2e4e8; --line2:#d7dae0; --txt:#1c2129; --dim:#5b6472; --dim2:#8891a0;
  --accent:#316dca; --accent-h:#2a5fb0; --accent-ring:rgba(49,109,202,.18);
  --ok:#1a7f37; --ok-bg:rgba(26,127,55,.1); --ok-border:rgba(26,127,55,.3);
  --err:#cf222e; --err-bg:rgba(207,34,46,.08); --err-txt:#a4030f; --err-border:rgba(207,34,46,.28);
  --shadow:rgba(28,33,41,.08); --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2129; --bg-input:#0d1117;
    --line:#262c36; --line2:#30363d; --txt:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
    --accent:#4c8eff; --accent-h:#3d7dda; --accent-ring:rgba(76,142,255,.22);
    --ok:#3fb950; --ok-bg:rgba(63,185,80,.1); --ok-border:rgba(63,185,80,.35);
    --err:#f85149; --err-bg:rgba(248,81,73,.1); --err-txt:#ff9b95; --err-border:rgba(248,81,73,.35);
    --shadow:rgba(1,4,9,.6);
  }
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2129; --bg-input:#0d1117;
  --line:#262c36; --line2:#30363d; --txt:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
  --accent:#4c8eff; --accent-h:#3d7dda; --accent-ring:rgba(76,142,255,.22);
  --ok:#3fb950; --ok-bg:rgba(63,185,80,.1); --ok-border:rgba(63,185,80,.35);
  --err:#f85149; --err-bg:rgba(248,81,73,.1); --err-txt:#ff9b95; --err-border:rgba(248,81,73,.35);
  --shadow:rgba(1,4,9,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; transition:background .15s,color .15s}


body{padding:0}
.bar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);
 background:var(--surface)}
.bar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.bar b{font-size:15px;font-weight:600}
.bar .spacer{flex:1}
.who{font-size:12.5px;color:var(--dim)}
.lien-sortie{font:inherit;font-size:12.5px;color:var(--dim);background:none;border:none;cursor:pointer;
 padding:6px 10px;border-radius:7px}
.lien-sortie:hover{background:var(--surface2);color:var(--txt)}
main{max-width:880px;margin:0 auto;padding:28px 20px}
h1{font-size:19px;font-weight:650;margin-bottom:4px}
.sous{color:var(--dim);font-size:13px;margin-bottom:22px}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.projet{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);
 border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;
 transition:border-color .12s,box-shadow .12s}
.projet:hover{border-color:var(--accent);box-shadow:0 2px 12px var(--shadow)}
.projet img{width:34px;height:34px;border-radius:9px;flex:none}
.projet .nom{font-weight:600;font-size:14px}
.projet .etat{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:2px}
.projet .etat i{width:7px;height:7px;border-radius:50%;background:var(--dim2);display:inline-block}
.projet .etat.on i{background:var(--ok)}
.projet .etat.off i{background:var(--err)}
.projet.arretee{opacity:.62;pointer-events:none}
.vide{padding:40px 20px;text-align:center;color:var(--dim);background:var(--surface);
 border:1px solid var(--line);border-radius:12px}
.vide b{display:block;color:var(--txt);font-size:15px;margin-bottom:6px}
</style></head><body>
<div class="bar"><div class="dot"></div><b>CodeLab</b><div class="spacer"></div>
  <span class="who" id="qui"></span>
  <button class="lien-sortie" onclick="sortir()">Deconnexion</button></div>
<main>
  <h1>Mes projets</h1>
  <div class="sous">Les projets que ton administrateur t'a autorises.</div>
  <div id="liste" class="liste"></div>
</main>
<script>
const $=i=>document.getElementById(i);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Trois etats distincts, comme dans le panneau d'administration : en ligne,
   demarree mais qui ne repond pas encore, et arretee. Les confondre ferait
   cliquer sur un lien qui ne menerait nulle part. */
function etat(a){
  if(!a.running) return ['off','arretee'];
  if(a.listening === false) return ['off','ne repond pas'];
  return ['on','en ligne'];
}

async function charger(){
  let d;
  try{ d = await (await fetch('/api/mes-apps')).json(); }
  catch(e){ return; }
  if(d.utilisateur) $('qui').textContent = d.utilisateur;

  const apps = d.apps || [];
  if(!apps.length){
    $('liste').className='';
    $('liste').innerHTML = '<div class="vide"><b>Aucun projet pour le moment</b>' +
      'Ton administrateur ne t\'a pas encore donne acces a un projet.</div>';
    return;
  }
  $('liste').className='liste';
  $('liste').innerHTML = apps.map(a=>{
    const [cl,txt]=etat(a);
    return `<a class="projet ${a.running?'':'arretee'}" href="/${encodeURIComponent(a.name)}/">
      <img src="/api/icon/${encodeURIComponent(a.name)}" alt="">
      <div><div class="nom">${esc(a.name)}</div>
      <div class="etat ${cl}"><i></i>${txt}</div></div></a>`;
  }).join('');
}

async function sortir(){ await fetch('/logout',{method:'POST'}); location.href='/login'; }
charger(); setInterval(charger, 10000);
</script>
</body></html>
