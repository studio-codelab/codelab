# CodeLab derriere un VPS -- configuration nginx du VPS.
#
#   navigateur --HTTPS--> VPS (ce nginx) --WireGuard--> ZimaBlade :9001
#
# Le VPS porte le nom de domaine et le certificat ; la ZimaBlade ne publie
# rien sur internet et reste joignable seulement par le tunnel.
#
# A poser dans /etc/nginx/sites-available/codelab.conf, puis :
#   ln -s /etc/nginx/sites-available/codelab.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Remplace codelab.exemple.fr par ton domaine, et 10.8.0.2 par l'adresse
# WireGuard de la ZimaBlade (voir ../wireguard/).

# --------------------------- redirection en clair ---------------------------
# Le port 80 ne sert qu'a deux choses : le renouvellement des certificats, et
# renvoyer les visiteurs vers HTTPS. Rien d'autre ne passe en clair.
server {
    listen 80;
    listen [::]:80;
    server_name codelab.exemple.fr;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ------------------------------- le panneau -------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codelab.exemple.fr;

    # HTTP/2 : la directive a change de forme en cours de route, et la
    # mauvaise fait echouer "nginx -t" avec « unknown directive ». Verifie ta
    # version (nginx -v), puis ajoute UNE de ces deux lignes :
    #   nginx >= 1.25.1 :  http2 on;
    #   nginx <  1.25.1 :  ecris plutot "listen 443 ssl http2;" ci-dessus.

    ssl_certificate     /etc/letsencrypt/live/codelab.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codelab.exemple.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS : le navigateur refusera de revenir en clair sur ce domaine. A
    # n'activer qu'une fois le certificat en place et verifie -- il est
    # memorise pour six mois, et une erreur ici ferme le site pour tout le
    # monde jusqu'a expiration.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Le panneau relaie le trafic des applications deployees : un build qui
    # recoit un fichier, un projet qui accepte un televersement. 1 Go est
    # large ; la valeur par defaut de nginx (1 Mo) ne l'est pas.
    client_max_body_size 1g;

    location / {
        proxy_pass http://10.8.0.2:9001;

        # LES TROIS EN-TETES QUI COMPTENT.
        #
        #   Host : le panneau doit connaitre son propre nom. Sans lui, il se
        #     croit appele sur 10.8.0.2 -- et les cles d'acces se lieraient
        #     au mauvais domaine, donc ne fonctionneraient plus le lendemain.
        #   X-Forwarded-Proto : sans lui, le panneau se croit servi en clair
        #     et signale HTTPS comme absent.
        #   X-Forwarded-For : sans lui, tous les visiteurs partagent l'adresse
        #     du tunnel -- la limite de tentatives compte alors tout le monde
        #     comme un seul, et le journal des acces note une seule adresse.
        #
        # Cote CodeLab, les deux derniers ne sont pris en compte que si
        # APP_MANAGER_TRUST_PROXY=1 : n'importe quel client peut poser ces
        # en-tetes, seul un proxy declare est cru.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # Les journaux en direct sont du Server-Sent Events : sans ces deux
        # lignes, nginx tamponne la reponse et le journal n'avance qu'a la
        # fermeture du flux -- c'est-a-dire jamais, puisqu'il reste ouvert.
        proxy_buffering off;
        proxy_read_timeout 600s;

        # Une application deployee peut parler WebSocket (Vite en
        # developpement, un tableau de bord temps reel).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

