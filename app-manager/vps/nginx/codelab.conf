# CodeLab derriere un VPS -- configuration nginx du VPS.
#
#   navigateur --HTTPS--> VPS (ce nginx) --WireGuard--> ZimaBlade
#     exemple.duckdns.org         -> le panneau        (:9001)
#     <app>.exemple.duckdns.org   -> chaque application (:9002)
#
# Le VPS porte le nom de domaine et le certificat ; la ZimaBlade ne publie
# rien sur internet et reste joignable seulement par le tunnel. Chaque
# application a son sous-domaine, a son nom : rien a declarer cote CodeLab.
#
# A poser dans /etc/nginx/sites-available/codelab.conf, puis :
#   ln -s /etc/nginx/sites-available/codelab.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Remplace exemple.duckdns.org par ton domaine, et 10.8.0.2 par l'adresse
# WireGuard de la ZimaBlade (voir ../wireguard/).

# --------------------------- redirection en clair ---------------------------
# Le port 80 ne sert qu'a deux choses : le renouvellement des certificats, et
# renvoyer les visiteurs vers HTTPS. Rien d'autre ne passe en clair.
server {
    listen 80;
    listen [::]:80;
    server_name exemple.duckdns.org *.exemple.duckdns.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ------------------------------- le panneau -------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exemple.duckdns.org;

    # HTTP/2 : la directive a change de forme en cours de route, et la
    # mauvaise fait echouer "nginx -t" avec « unknown directive ». Verifie ta
    # version (nginx -v), puis ajoute UNE de ces deux lignes :
    #   nginx >= 1.25.1 :  http2 on;
    #   nginx <  1.25.1 :  ecris plutot "listen 443 ssl http2;" ci-dessus.

    # Un seul certificat pour le domaine ET ses sous-domaines (*.exemple...),
    # obtenu par le DNS : voir l'etape 3 du README.
    ssl_certificate     /etc/letsencrypt/live/exemple.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemple.duckdns.org/privkey.pem;

    # HSTS : le navigateur refusera de revenir en clair sur ce domaine. A
    # n'activer qu'une fois le certificat en place et verifie -- il est
    # memorise pour six mois, et une erreur ici ferme le site pour tout le
    # monde jusqu'a expiration.
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 1g;

    location / {
        proxy_pass http://10.8.0.2:9001;
        include /etc/nginx/snippets/codelab-relais.conf;
    }
}

# ---------------------------- les applications ----------------------------
# blog.exemple.duckdns.org sert l'application « blog » : le panneau lit le
# sous-domaine. Le port 9002 est une autre origine que le panneau -- une
# faille dans une application n'atteint pas le panneau.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.exemple.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/exemple.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemple.duckdns.org/privkey.pem;

    # Une application recoit un fichier, un televersement : 1 Go est large ;
    # la valeur par defaut de nginx (1 Mo) ne l'est pas.
    client_max_body_size 1g;

    location / {
        proxy_pass http://10.8.0.2:9002;
        include /etc/nginx/snippets/codelab-relais.conf;
    }
}

