# A poser dans /etc/nginx/snippets/ : ce que codelab.conf transmet a CodeLab,
# pour le panneau comme pour les applications.
#
#   Host : CodeLab y lit le domaine (et, pour une application, son nom). Sans
#     lui, il se croit appele sur 10.8.0.2 : plus de sous-domaines, et les
#     cles d'acces se lieraient au mauvais domaine.
#   X-Forwarded-Proto : sans lui, CodeLab se croit servi en clair.
#   X-Forwarded-For : sans lui, tous les visiteurs partagent l'adresse du
#     tunnel -- la limite de tentatives les compterait comme un seul.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP         $remote_addr;

# Les journaux en direct sont du Server-Sent Events : sans ces deux lignes,
# nginx tamponne la reponse et le journal n'avance jamais.
proxy_buffering off;
proxy_read_timeout 600s;

# Une application peut parler WebSocket (Vite, un tableau de bord temps reel).
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
