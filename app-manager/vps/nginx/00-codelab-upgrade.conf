# A poser dans /etc/nginx/conf.d/ : la variable que codelab.conf utilise pour
# relayer les WebSocket. Elle vaut "upgrade" quand le client en demande un, et
# "close" sinon -- poser "Connection: upgrade" en dur casserait les requetes
# ordinaires.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
