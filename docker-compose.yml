# CodeLab -- environnement de developpement auto-heberge.
#
#   docker compose up -d
#
# Les donnees vivent sous /DATA/AppData/codelab/ sur l'hote ; pour les ranger
# ailleurs, editer les chemins hote des volumes ci-dessous.
#
# Une variante de ce fichier, docker-compose-casaos.yml, ajoute les
# metadonnees d'affichage lues par les interfaces d'installation de type
# CasaOS (icone, titre, note affichee avant
# installation). Le reste est
# identique : toute modification faite ici doit y etre reportee.
#
# DURCISSEMENT DES CONTENEURS
#
# Six des sept services tournent avec cap_drop: ALL et no-new-privileges : ils
# n'ont plus que les quelques capabilities dont ils se servent reellement,
# listees et justifiees service par service ci-dessous. codelab-dev en est
# exclu volontairement -- c'est le shell, et le durcir casserait sudo et la
# separation de privileges de sshd.
#
# Si un service refuse de demarrer apres une mise a jour : commente ses lignes
# security_opt / cap_drop / cap_add, relance, et signale-le. Une capability
# manquante se voit dans "docker logs <service>" sous la forme d'un
# "Operation not permitted" -- c'est elle qu'il faut rendre, pas tout le
# bloc.

# LIMITES DE RESSOURCES ET JOURNAUX
#
# Sans elles, une seule application partie en boucle emportait la machine
# entiere : le panneau devenait injoignable, donc on ne pouvait meme plus
# l'arreter depuis le panneau. Et sans rotation, les journaux Docker
# grossissaient sans fin jusqu'a remplir le disque -- la sonde du diagnostic
# l'annoncait, au moment ou il etait deja plein.
#
# Ce sont des PLAFONDS, pas des reservations : un service qui n'en a pas
# besoin ne les consomme pas. Leur somme depasse volontairement la RAM de la
# machine -- ce qu'on veut empecher, c'est qu'UN service prenne tout, pas
# repartir la memoire a l'avance.
#
# CIBLE : 4 Go et 2 coeurs.
#
# Les valeurs visaient auparavant 8 Go, et elles ne bornaient plus rien sur
# une machine deux fois plus petite : un plafond de 4 Go pour le panneau, sur
# un serveur qui en a 4, laisse ce seul service emporter la machine -- ce que
# ces lignes existent precisement pour empecher. Un plafond au-dessus de la
# RAM disponible n'est pas une securite large, c'est une securite absente.
#
# Total actuel : 4,8 Go de plafonds. La
# somme depasse encore les 4 Go, et c'est toujours voulu -- mais aucun
# service ne peut plus prendre a lui seul plus du tiers de la machine.
#
# CPU : meme raisonnement. Un plafond de 2.0 sur un serveur bi-coeur ne
# limite rien. Aucun service ne depasse desormais 1.5.
#
# Si un service est tue par manque de memoire (code de sortie 137, "OOMKilled"
# dans docker inspect), augmente SA ligne plutot que de retirer le bloc -- et
# si la machine est plus grande, remonte l'ensemble proportionnellement.

# LE NOM DU PROJET, ecrit ici et pas devine.
#
# Sans cette ligne, Docker Compose nomme le projet d'apres le DOSSIER qui
# contient ce fichier. Cloner dans "codelab" donne "codelab" ; telecharger
# l'archive ZIP de GitHub donne "codelab-main" ; et une interface qui copie
# ce fichier dans un dossier a elle -- CasaOS le fait -- donne un nom du
# genre "compose-d4601441b33edb0f".
#
# Ce nom n'est pas cosmetique : il prefixe les ressources creees par Compose
# et, sur CasaOS, il DONNE SON NOM AU DOSSIER de l'application. Le fixer ici
# le rend identique partout, quel que soit le chemin d'ou l'on demarre.
#
# ATTENTION SUR UNE INSTALLATION EXISTANTE dont le projet portait un autre
# nom : Compose ne reconnaitra plus ses conteneurs (il les repere par un
# label de projet) et voudra en creer de nouveaux, alors que les noms de
# conteneurs sont deja pris. Faire "docker compose down" AVANT la mise a
# jour, puis "up -d". Les donnees ne bougent pas : elles vivent dans
# /DATA/AppData/codelab/, pas dans des volumes nommes par le projet.
name: codelab

# LE DOSSIER DES PROJETS, ECRIT UNE SEULE FOIS. Vecu : « Point de montage
# /workspace commun a tous les services. Je peux changer le path [...], et
# tous les autres services pointent vers le nouveau path ». Les trois
# services qui le montent (codelab-dev, codelab-dagster, codelab-app-manager)
# reprennent cette ligne par l'ancre *workspace : pour deplacer les projets,
# change le chemin hote (avant « : ») ICI, et seulement ici. Le chemin dans
# les conteneurs, /workspace, ne change jamais.
x-codelab-workspace: &workspace /DATA/AppData/codelab/workspace:/workspace

services:

  codelab-postgres:
    # L'image officielle postgres, plus un entrypoint versionne qui genere le
    # mot de passe et ecrit credentials.env (voir postgres/entrypoint.sh).
    # Ce script vivait dans ce fichier, en entrypoint inline ; Compose
    # interpole les "$$VAR" d'un script inline avant que le shell ne les
    # voie, et certaines interfaces d'installation reecrivent le compose a
    # l'import, ce qui annule l'echappement cense y remedier -- Postgres ne
    # demarrait plus ("mkdir: cannot create directory ''"). Dans une image,
    # le script ne traverse plus aucune de ces reecritures.
    image: ghcr.io/studio-codelab/codelab-postgres:latest
    container_name: codelab-postgres
    restart: unless-stopped

    # La base. 1 Go suffit largement au volume d'un serveur personnel. Voir l'explication en tete de fichier.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Durcissement : tout retirer, puis rendre le strict necessaire.
    # L'image officielle demarre en root, prepare le cluster et bascule sur
    # l'utilisateur postgres -- d'ou SETUID/SETGID -- apres avoir pose les
    # droits du repertoire de donnees -- d'ou CHOWN, FOWNER, DAC_OVERRIDE.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    environment:
      # Base d'INSTANCE de Dagster (runs, evenements, planifications), creee
      # par l'image officielle a l'initialisation du cluster. Ce n'est pas une
      # base fourre-tout : les donnees d'un projet vont dans la base du projet.
      POSTGRES_DB: dagster
      POSTGRES_USER: codelab
      # Bases de projet creees (ou completees) a chaque demarrage par
      # l'entrypoint, avec leur schema "dagster" et le search_path qui va
      # avec. Liste separee par des espaces. Un projet ajoute plus tard se
      # provisionne sans redemarrage avec "codelab db <nom>" depuis une
      # session SSH.
      CODELAB_PROJECT_DBS: "diagnostic"
      # Pas de POSTGRES_PASSWORD/_FILE ici : l'entrypoint ci-dessus lit la
      # valeur dans credentials.env et l'exporte lui-meme.

    volumes:
      # Les sauvegardes. C'est ce conteneur qui les ecrit : pg_dump
      # refuse de sauvegarder un serveur plus recent que lui, et il
      # est le seul de la stack a porter la version exacte du
      # serveur. Restauration : postgres/README.md.
      - /DATA/AppData/codelab/sauvegardes:/sauvegardes
      # Chemin hote par defaut : /DATA/AppData/codelab/postgres. Ecrit en
      # litteral, sans variable : les interfaces d'installation qui lisent ce
      # fichier pour proposer un champ modifiable ne savent pas resoudre une
      # variable, et echouent dessus. Pour ranger les donnees ailleurs,
      # editer ce chemin ici.
      - /DATA/AppData/codelab/postgres:/var/lib/postgresql
      # Pas ":ro" ici : c'est ce service qui cree credentials.env et y ecrit
      # le mot de passe. Les autres le montent en lecture seule, sauf
      # app-manager qui y ajoute son propre bloc.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelab -d dagster"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - codelab


  codelab-redis:
    # Redis : cache, sessions, files de taches, compteurs -- partage par les
    # applications, qui le recoivent du panneau sous REDIS_URL. Meme
    # construction que Postgres : l'image officielle plus un entrypoint qui
    # genere le mot de passe dans credentials.env (voir redis/entrypoint.sh).
    image: ghcr.io/studio-codelab/codelab-redis:latest
    container_name: codelab-redis
    restart: unless-stopped

    # 320 Mo : le plancher impose par CasaOS (voir codelab-dagster-proxy),
    # pas un besoin. Les DONNEES sont plafonnees plus bas, a 192 Mo, par
    # l'entrypoint : Redis a besoin de marge au-dela de ses cles quand il
    # reecrit son journal.
    mem_limit: 320m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # L'entrypoint ecrit sa configuration en root dans un dossier qui
    # appartient a redis -- d'ou DAC_OVERRIDE, CHOWN et FOWNER --, puis
    # l'image officielle bascule sur l'utilisateur redis -- d'ou
    # SETUID/SETGID.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # Pas de "ports", volontairement : Redis n'est joignable que depuis le
    # reseau de la stack. Un Redis publie sur Internet est l'une des portes
    # les plus exploitees qui soient.

    volumes:
      # Le journal des ecritures (appendonly). Ce n'est pas une sauvegarde :
      # ce qui compte vraiment va dans Postgres.
      - /DATA/AppData/codelab/redis:/data
      # Lecture-ecriture : ce service y ecrit son bloc.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    healthcheck:
      # Un PING authentifie ; le script lit le mot de passe lui-meme, sans
      # "$" a faire traverser le compose.
      test: ["CMD", "codelab-redis-sante"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - codelab


  codelab-mailpit:
    # L'envoi de mails des applications. Elles parlent SMTP a ce service
    # (MAIL_HOST/MAIL_PORT, transmis par le panneau) ; il garde chaque mail
    # consultable -- interface sur le port 8025, a travers
    # codelab-dagster-proxy et la session d'administration du panneau -- et
    # le relaie par le serveur d'envoi de Parametres > E-mail. Voir
    # mailpit/README.md.
    image: ghcr.io/studio-codelab/codelab-mailpit:latest
    container_name: codelab-mailpit
    restart: unless-stopped

    # 320 Mo : le plancher impose par CasaOS (voir codelab-dagster-proxy).
    # Mailpit en consomme une trentaine.
    mem_limit: 320m
    cpus: 0.25
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Mailpit tourne en root dans son image, sans rien demander au noyau.
    # DAC_OVERRIDE seulement pour ecrire dans un dossier de donnees qu'une
    # interface d'installation aurait donne a un autre utilisateur.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

    # Pas de "ports" : le SMTP n'est joignable que depuis le reseau de la
    # stack, et l'interface passe par codelab-dagster-proxy.

    environment:
      MP_DATABASE: /data/mailpit.db
      # Ce qui est garde : les 500 derniers mails, un mois au plus. Ils
      # contiennent des liens de reinitialisation de mot de passe.
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: "30d"
      # Les applications envoient sans identifiants ; certaines en
      # presentent quand meme par habitude : on les accepte, sur le reseau
      # interne seulement.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      # "auto" : relaie des qu'un serveur d'envoi est regle dans le panneau.
      # "non" : garde tout sans rien envoyer -- le mode test.
      CODELAB_MAILPIT_RELAIS: "auto"
      # Plafond d'envoi : au-dela, sur l'heure ou les 24 heures glissantes,
      # les mails sont gardes sans etre relayes -- une application en boucle
      # ne fait pas suspendre le compte d'envoi (Gmail : ~500 par jour).
      CODELAB_MAILPIT_MAX_HEURE: "50"
      CODELAB_MAILPIT_MAX_JOUR: "200"

    volumes:
      - /DATA/AppData/codelab/mailpit:/data
      # Lecture-ecriture : ce service y ecrit son bloc (MAIL_HOST...).
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - codelab


  codelab-dev:
    image: ghcr.io/studio-codelab/codelab-dev:latest
    container_name: codelab-dev
    restart: unless-stopped

    # Le shell : on y compile, d'ou une part plus large que les services. Voir l'explication en tete de fichier.
    #
    # 1280m et 1024 processus, parce que 896m et 512 tuaient VS Code. Une
    # session Remote-SSH, c'est le serveur VS Code, son hote d'extensions,
    # Codex (son extension ET son agent), les serveurs de langage, la JVM de
    # Database Client JDBC, et git a chaque rafraichissement. A 896m le noyau
    # tuait l'hote d'extensions : l'agent IA et la vue Git redemarraient en
    # boucle. Et pids_limit compte les FILS D'EXECUTION, pas les processus --
    # chaque Node en ouvre une dizaine, la JVM plusieurs dizaines : a 512, un
    # thread refuse suffisait a faire tomber l'hote d'extensions de la meme
    # facon, sans aucune trace « OOMKilled ».
    mem_limit: 1280m
    cpus: 1.5
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # PAS de durcissement ici, et c'est un choix.
    #
    # Ce conteneur EST le shell : sshd ouvre une session, et cap_drop: ALL
    # l'empeche de faire sa separation de privileges. On durcirait exactement
    # ce pour quoi ce service existe.
    #
    # PRECISION, parce que ce commentaire a dit le contraire : le frein n'est
    # PAS sudo. sudo est bien installe dans l'image, mais l'utilisateur des
    # sessions ("vscode") n'est dans aucun groupe d'administration et aucune
    # regle sudoers ne lui est deposee -- il ne peut donc pas s'en servir.
    # sudo ne sert qu'a root, entre par "docker exec". C'est ce qui met
    # credentials.env (0600 root) hors de portee d'une session, et donc de
    # l'agent de developpement qui y tourne.
    #
    # Ces faits tiennent par absence, et une ligne ajoutee un jour les
    # romprait en silence : la section 36 de workspace/diagnostic/checks.py
    # les retient.
    #
    # Ce qui le protege par ailleurs est deja en place : aucun mot de passe
    # (cle publique uniquement), pas de connexion root, et une seule facon
    # d'autoriser une machine -- deposer sa cle dans
    # config/ssh/authorized_keys.d/.

    ports:
      - "2222:22"

    environment:
      PGHOST: codelab-postgres
      PGPORT: "5432"
      # Le compte administrateur, pour le seul gardien des bases (un processus
      # root du poste) : les sessions SSH ne l'ont pas. Dans le dossier d'un
      # projet, elles recoivent le compte de SA base (voir dev/README.md,
      # « Une base, un compte »).
      PGDATABASE: diagnostic
      PGUSER: codelab
      # Le mot de passe est lu dans credentials.env, comme partout ailleurs.
      CODELAB_ENV_FILE: /var/lib/codelab/config/credentials.env
      # Cles autorisees + cles hote, dans un seul dossier.
      CODELAB_SSH_DIR: /var/lib/codelab/ssh
      # Extensions VS Code installees d'office sur le serveur VS Code du
      # conteneur, a la premiere connexion Remote-SSH (voir dev/README.md).
      # Separees par des espaces ; vide pour n'en installer aucune.
      CODELAB_VSCODE_EXTENSIONS: "mtxr.sqltools mtxr.sqltools-driver-pg cweijan.vscode-database-client2 cweijan.dbclient-jdbc"

    volumes:
      # Le dossier des projets : voir x-codelab-workspace, en tete de fichier.
      - *workspace
      # Un seul dossier pour tout le SSH : authorized_keys.d/ (une cle
      # publique par machine autorisee), authorized_keys (fichier derive,
      # reconstruit au demarrage) et host_keys/ (identite du serveur, pour
      # que l'empreinte ne change pas a chaque recreation du conteneur).
      # En lecture-ecriture : c'est ce service qui genere les cles hote au
      # premier demarrage et qui reconstruit le fichier derive.
      - /DATA/AppData/codelab/config/ssh:/var/lib/codelab/ssh
      # LE SERVEUR VS CODE, ET SES EXTENSIONS.
      #
      # Remote-SSH installe son serveur et les extensions du poste dans
      # ~/.vscode-server, DANS le conteneur. Rien ne montait ce dossier :
      # chaque mise a jour de l'image -- donc chaque « compose pull » --
      # effacait toutes les extensions installees, et il fallait les
      # reinstaller une par une sans savoir pourquoi elles avaient disparu.
      #
      # Un dossier a part et pas /workspace : ce sont des binaires lies a la
      # version de VS Code du poste, pas du code a sauvegarder. Les effacer
      # pour repartir propre ne doit rien couter d'autre qu'une
      # reinstallation.
      - /DATA/AppData/codelab/vscode-server:/home/vscode/.vscode-server
      # Cible differente du montage ci-dessus, donc pas d'imbrication : le
      # fichier de secrets reste en lecture seule pour ce conteneur.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    # Pas de "depends_on: codelab-postgres: condition: service_healthy" ici,
    # volontairement -- observe a plusieurs reprises qu'un orchestrateur
    # laisse ce conteneur a l'etat "Created" (jamais demarre) si Postgres met
    # un peu de temps a devenir "healthy" a l'installation. codelab-dev
    # n'a pas besoin que Postgres soit deja pret a cet instant precis : les
    # identifiants sont lus depuis un fichier au demarrage, et une vraie
    # connexion a la base n'est necessaire que lorsque l'utilisateur s'en
    # sert depuis une session SSH, pas au boot du conteneur lui-meme.

    networks:
      - codelab


  codelab-dagster:
    image: ghcr.io/studio-codelab/codelab-dagster:latest
    container_name: codelab-dagster
    restart: unless-stopped

    # L'interface web ET le daemon (plannings, capteurs, file des runs), dans
    # ce seul conteneur -- voir dagster/lancer.sh. Ils etaient deux services :
    # meme image, memes montages, memes capacites, meme utilisateur. Le
    # plafond est la somme des deux anciens (512 + 384 Mo), sous le tiers de
    # la machine.
    mem_limit: 896m
    cpus: 1.0
    pids_limit: 768
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Durcissement. Ce service execute du code arbitraire (c'est sa raison
    # d'etre) : c'est celui ou une capability inutile coute le plus cher.
    # Il lui reste de quoi poser les droits de /workspace au demarrage et
    # basculer sur l'utilisateur dagster.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # Pas de "ports" ici, volontairement : Dagster n'a aucune
    # authentification, et son interface permet de lancer des jobs -- donc
    # d'executer du code. Il n'est accessible qu'a travers
    # codelab-dagster-proxy, qui publie le port 3000 et demande un mot de
    # passe.

    environment:
      DAGSTER_HOME: /opt/dagster/home
      PYTHONUNBUFFERED: "1"
      # Permet a "-m definitions" de resoudre /workspace/definitions.py
      # (monte en volume) plutot que la copie embarquee dans l'image.
      PYTHONPATH: /workspace
      DAGSTER_PG_HOST: codelab-postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_DB: dagster
      DAGSTER_PG_USER: codelab
      # Mot de passe lu dans credentials.env par l'entrypoint, qui l'exporte
      # en DAGSTER_PG_PASSWORD (dagster.yaml ne sait lire qu'une env var).
      CODELAB_ENV_FILE: /var/lib/codelab/config/credentials.env

    volumes:
      - /DATA/AppData/codelab/dagster:/opt/dagster/home
      - *workspace
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    depends_on:
      codelab-postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - codelab


  codelab-app-manager:
    image: ghcr.io/studio-codelab/codelab-app-manager:latest
    container_name: codelab-app-manager
    restart: unless-stopped

    # LA PART LA PLUS LARGE, et c'est normal : ce conteneur porte le panneau, les builds npm ET toutes les applications deployees, qui sont ses processus fils. Trop juste ici, c'est une application tuee au hasard par le noyau en plein build. Voir l'explication en tete de fichier.
    mem_limit: 1280m
    cpus: 1.5
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Durcissement. SETUID/SETGID sont indispensables ici : c'est ce qui
    # permet a drop_privileges() de faire tomber chaque application sur son
    # propre uid. Les retirer ne durcirait rien, cela DESACTIVERAIT
    # l'isolation des applications.
    #
    # KILL l'est tout autant, et son absence a coute cher : le panneau tourne
    # en root, mais le noyau n'autorise un signal que si l'expediteur a
    # CAP_KILL ou s'il a l'uid de sa cible. Chaque application tournant sous
    # SON PROPRE uid, root se voyait refuser l'arret de toutes -- « Operation
    # not permitted », bouton « Arreter » sans effet. Le panneau ne signale
    # que les processus qu'il a lui-meme lances.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID

    ports:
      - "9001:9001"
      # Les applications deployees sont servies ICI, sur un port a part -- donc
      # dans une origine differente de celle du panneau. C'est ce qui empeche
      # une faille dans une application d'atteindre le panneau : le navigateur
      # traite deux ports comme deux sites, et refuse a l'un de lire l'autre.
      # Sans ce port publie, le panneau s'en apercoit et continue de servir
      # les applications lui-meme. Derriere un VPS, c'est aussi ce port qui
      # sert chaque application sur son sous-domaine (app-manager/vps/).
      - "9002:9002"

    volumes:
      - /DATA/AppData/codelab/app-manager:/var/lib/codelab/app-manager
      - *workspace
      # Lecture-ecriture (pas ":ro") : ce service ajoute sa propre ligne
      # dans le credentials.env consolide partage avec codelab-postgres.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config
      # Le MEME dossier que celui de codelab-postgres : les dumps
      # des bases et l'archive de l'etat du panneau (comptes,
      # applications declarees, journal) se retrouvent au meme
      # endroit, et se copient ailleurs d'un seul geste. Chacun
      # des deux services sauvegarde ce qu'il est SEUL a voir.
      - /DATA/AppData/codelab/sauvegardes:/sauvegardes

    environment:
      APP_MANAGER_STATE: /var/lib/codelab/app-manager
      APP_MANAGER_ROOT: /workspace
      MANAGER_PORT: "9001"
      # Ecrit noir sur blanc, alors que le panneau prend deja 9002 par
      # defaut : une valeur devinee ne se relit pas. Le port publie
      # ci-dessus et celui que sert le panneau doivent etre le meme, et
      # c'est ici qu'on le voit d'un coup d'oeil.
      APP_MANAGER_APPS_PORT: "9002"
      APP_MANAGER_SHARED_CONFIG: /var/lib/codelab/config

      # --- Le jour ou ce panneau sort de ton reseau ---------------------
      # RIEN A REGLER ICI : ouvert par son nom de domaine (app-manager/vps/),
      # le panneau retient cette adresse et sert chaque application sur
      # https://<son-nom>.<domaine>. X-Forwarded-For n'est jamais cru,
      # l'administration ne repond qu'au reseau local en connexion directe,
      # et le cookie devient Secure des que la requete arrive en https.
      # APP_MANAGER_HTTPS=1 peut seulement forcer Secure ;
      # APP_MANAGER_PUBLIC_URL impose l'adresse publique.
      #
      # APP_MANAGER_HTTPS: "1"
      # APP_MANAGER_PUBLIC_URL: "https://toi.duckdns.org"
      # Second facteur OBLIGATOIRE pour le compte d'administration. Marche
      # arriere en cas de telephone perdu : decommenter, relancer, se
      # reconnecter, enregistrer un nouveau facteur, puis recommenter.
      # APP_MANAGER_ADMIN_2FA: "0"

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - codelab


  codelab-dagster-proxy:
    image: ghcr.io/studio-codelab/codelab-dagster-proxy:latest
    container_name: codelab-dagster-proxy
    restart: unless-stopped

    # 320 Mo POUR UN NGINX QUI RELAIE : ce n'est pas un besoin, c'est un
    # plancher impose de l'exterieur. Il en consomme une vingtaine.
    #
    # LA CAUSE, MESUREE. « docker compose config » sur la machine de
    # reference montre ce que CasaOS/ZimaOS ajoute en recopiant ce compose --
    # a CHAQUE service, la meme valeur, absente de nos fichiers :
    #
    #     deploy.resources.reservations.memory: "268435456"   (256 Mio)
    #
    # Docker refuse alors de creer un conteneur dont le PLAFOND est sous
    # cette RESERVATION : « Minimum memory limit can not be less than memory
    # reservation limit ». Le proxy, plafonne a 96 Mo, etait le seul en
    # dessous : toute la stack s'arretait sur lui.
    #
    # 320 et pas 256 : 64 Mo de marge, parce que cette reservation n'est pas
    # la notre et que personne ne nous previendra le jour ou elle montera.
    # 320 et pas plus : c'est la plus petite part de la stack, et un test
    # voisin exige que ce relais la garde.
    mem_limit: 320m
    cpus: 0.25
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # nginx : le maitre demarre en root pour lire sa configuration et ouvrir
    # son port, puis les workers tournent en "nginx". Rien d'autre.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    ports:
      - "3000:3000"
      # L'interface de Mailpit, derriere la meme session d'administration
      # (voir dagster/proxy/mailpit.conf).
      - "8025:8025"

    volumes:
      # Lecture-ecriture : ce service ajoute son propre bloc (identifiants
      # d'acces a Dagster) dans le credentials.env partage.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    depends_on:
      - codelab-dagster

    healthcheck:
      # 401 attendu sans identifiants : c'est la preuve que nginx repond ET
      # que l'authentification est bien en place. Un 200 ici signifierait
      # qu'elle est tombee.
      # Sonde dediee, hors du chemin authentifie : une requete sur "/" sans
      # session redirige maintenant vers le panneau, et wget suivrait cette
      # redirection vers un hote absent de ce conteneur.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/_sante"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - codelab


networks:
  codelab:
    name: codelab_codelab
