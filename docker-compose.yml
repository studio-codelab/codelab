# CodeLab -- environnement de developpement auto-heberge.
#
#   docker compose up -d
#
# Les donnees vivent sous /DATA/AppData/codelab/ sur l'hote ; pour les ranger
# ailleurs, editer les chemins hote des volumes ci-dessous.
#
# Une variante de ce fichier, docker-compose-casaos.yml, ajoute les
# metadonnees d'affichage lues par les interfaces d'installation de type
# CasaOS (icone, titre, note affichee avant
# installation). Le reste est
# identique : toute modification faite ici doit y etre reportee.
#
# DURCISSEMENT DES CONTENEURS
#
# Cinq des six services tournent avec cap_drop: ALL et no-new-privileges : ils
# n'ont plus que les quelques capabilities dont ils se servent reellement,
# listees et justifiees service par service ci-dessous. codelab-dev en est
# exclu volontairement -- c'est le shell, et le durcir casserait sudo et la
# separation de privileges de sshd.
#
# Si un service refuse de demarrer apres une mise a jour : commente ses lignes
# security_opt / cap_drop / cap_add, relance, et signale-le. Une capability
# manquante se voit dans "docker logs <service>" sous la forme d'un
# "Operation not permitted" -- c'est elle qu'il faut rendre, pas tout le
# bloc.

services:

  codelab-postgres:
    # L'image officielle postgres, plus un entrypoint versionne qui genere le
    # mot de passe et ecrit credentials.env (voir postgres/entrypoint.sh).
    # Ce script vivait dans ce fichier, en entrypoint inline ; Compose
    # interpole les "$$VAR" d'un script inline avant que le shell ne les
    # voie, et certaines interfaces d'installation reecrivent le compose a
    # l'import, ce qui annule l'echappement cense y remedier -- Postgres ne
    # demarrait plus ("mkdir: cannot create directory ''"). Dans une image,
    # le script ne traverse plus aucune de ces reecritures.
    image: ghcr.io/lucasrtn/codelab-postgres:latest
    container_name: codelab-postgres
    restart: unless-stopped

    # Durcissement : tout retirer, puis rendre le strict necessaire.
    # L'image officielle demarre en root, prepare le cluster et bascule sur
    # l'utilisateur postgres -- d'ou SETUID/SETGID -- apres avoir pose les
    # droits du repertoire de donnees -- d'ou CHOWN, FOWNER, DAC_OVERRIDE.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    environment:
      # Base d'INSTANCE de Dagster (runs, evenements, planifications), creee
      # par l'image officielle a l'initialisation du cluster. Ce n'est pas une
      # base fourre-tout : les donnees d'un projet vont dans la base du projet.
      POSTGRES_DB: dagster
      POSTGRES_USER: codelab
      # Bases de projet creees (ou completees) a chaque demarrage par
      # l'entrypoint, avec leur schema "dagster" et le search_path qui va
      # avec. Liste separee par des espaces. Un projet ajoute plus tard se
      # provisionne sans redemarrage avec "codelab db <nom>" depuis une
      # session SSH.
      CODELAB_PROJECT_DBS: diagnostic
      # Pas de POSTGRES_PASSWORD/_FILE ici : l'entrypoint ci-dessus lit la
      # valeur dans credentials.env et l'exporte lui-meme.

    volumes:
      # Chemin hote par defaut : /DATA/AppData/codelab/postgres. Ecrit en
      # litteral, sans variable : les interfaces d'installation qui lisent ce
      # fichier pour proposer un champ modifiable ne savent pas resoudre une
      # variable, et echouent dessus. Pour ranger les donnees ailleurs,
      # editer ce chemin ici.
      - /DATA/AppData/codelab/postgres:/var/lib/postgresql
      # Pas ":ro" ici : c'est ce service qui cree credentials.env et y ecrit
      # le mot de passe. Les autres le montent en lecture seule, sauf
      # app-manager qui y ajoute son propre bloc.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelab -d dagster"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - codelab


  codelab-dev:
    image: ghcr.io/lucasrtn/codelab-dev:latest
    container_name: codelab-dev
    restart: unless-stopped

    # PAS de durcissement ici, et c'est un choix.
    #
    # Ce conteneur EST le shell : sshd ouvre une session, et "sudo" y est
    # installe parce qu'un environnement de developpement en a besoin. Or
    # no-new-privileges casse sudo -- silencieusement, avec un message qui
    # n'explique rien -- et cap_drop: ALL empeche sshd de faire sa separation
    # de privileges. On durcirait exactement ce pour quoi ce service existe.
    #
    # Ce qui le protege est ailleurs, et c'est deja en place : aucun mot de
    # passe (cle publique uniquement), pas de connexion root, et une seule
    # facon d'autoriser une machine -- deposer sa cle dans
    # config/ssh/authorized_keys.d/.

    ports:
      - "2222:22"

    environment:
      PGHOST: codelab-postgres
      PGPORT: "5432"
      # Une session SSH atterrit dans la base du projet modele, pas dans la
      # base d'instance de Dagster ni dans la base de maintenance "postgres" :
      # c'est la ou se trouvent les tables qu'on vient regarder. Pour en
      # changer le temps d'une commande : psql -d autre-projet.
      PGDATABASE: diagnostic
      PGUSER: codelab
      # Le mot de passe est lu dans credentials.env, comme partout ailleurs.
      CODELAB_ENV_FILE: /var/lib/codelab/config/credentials.env
      # Cles autorisees + cles hote, dans un seul dossier.
      CODELAB_SSH_DIR: /var/lib/codelab/ssh

    volumes:
      # Chemin hote par defaut : /DATA/AppData/codelab/workspace. Doit rester
      # identique sur les 4 services qui le montent (dev, dagster,
      # dagster-daemon, app-manager).
      - /DATA/AppData/codelab/workspace:/workspace
      # Un seul dossier pour tout le SSH : authorized_keys.d/ (une cle
      # publique par machine autorisee), authorized_keys (fichier derive,
      # reconstruit au demarrage) et host_keys/ (identite du serveur, pour
      # que l'empreinte ne change pas a chaque recreation du conteneur).
      # En lecture-ecriture : c'est ce service qui genere les cles hote au
      # premier demarrage et qui reconstruit le fichier derive.
      - /DATA/AppData/codelab/config/ssh:/var/lib/codelab/ssh
      # Cible differente du montage ci-dessus, donc pas d'imbrication : le
      # fichier de secrets reste en lecture seule pour ce conteneur.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    # Pas de "depends_on: codelab-postgres: condition: service_healthy" ici,
    # volontairement -- observe a plusieurs reprises qu'un orchestrateur
    # laisse ce conteneur a l'etat "Created" (jamais demarre) si Postgres met
    # un peu de temps a devenir "healthy" a l'installation. codelab-dev
    # n'a pas besoin que Postgres soit deja pret a cet instant precis : les
    # identifiants sont lus depuis un fichier au demarrage, et une vraie
    # connexion a la base n'est necessaire que lorsque l'utilisateur s'en
    # sert depuis une session SSH, pas au boot du conteneur lui-meme.

    networks:
      - codelab


  codelab-dagster:
    image: ghcr.io/lucasrtn/codelab-dagster:latest
    container_name: codelab-dagster
    restart: unless-stopped

    # Durcissement. Ce service execute du code arbitraire (c'est sa raison
    # d'etre) : c'est celui ou une capability inutile coute le plus cher.
    # Il lui reste de quoi poser les droits de /workspace au demarrage et
    # basculer sur l'utilisateur dagster.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # Pas de "ports" ici, volontairement : Dagster n'a aucune
    # authentification, et son interface permet de lancer des jobs -- donc
    # d'executer du code. Il n'est accessible qu'a travers
    # codelab-dagster-proxy, qui publie le port 3000 et demande un mot de
    # passe.

    environment:
      DAGSTER_HOME: /opt/dagster/home
      PYTHONUNBUFFERED: "1"
      # Permet a "-m definitions" de resoudre /workspace/definitions.py
      # (monte en volume) plutot que la copie embarquee dans l'image.
      PYTHONPATH: /workspace
      DAGSTER_PG_HOST: codelab-postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_DB: dagster
      DAGSTER_PG_USER: codelab
      # Mot de passe lu dans credentials.env par l'entrypoint, qui l'exporte
      # en DAGSTER_PG_PASSWORD (dagster.yaml ne sait lire qu'une env var).
      CODELAB_ENV_FILE: /var/lib/codelab/config/credentials.env

    volumes:
      - /DATA/AppData/codelab/dagster:/opt/dagster/home
      - /DATA/AppData/codelab/workspace:/workspace
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    depends_on:
      codelab-postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - codelab


  codelab-dagster-daemon:
    image: ghcr.io/lucasrtn/codelab-dagster:latest
    container_name: codelab-dagster-daemon
    restart: unless-stopped

    # Meme image, meme code arbitraire, meme durcissement.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    command:
      - dagster-daemon
      - run
      - -m
      - definitions

    environment:
      DAGSTER_HOME: /opt/dagster/home
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace
      DAGSTER_PG_HOST: codelab-postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_DB: dagster
      DAGSTER_PG_USER: codelab
      # Mot de passe lu dans credentials.env par l'entrypoint, qui l'exporte
      # en DAGSTER_PG_PASSWORD (dagster.yaml ne sait lire qu'une env var).
      CODELAB_ENV_FILE: /var/lib/codelab/config/credentials.env

    volumes:
      - /DATA/AppData/codelab/dagster:/opt/dagster/home
      - /DATA/AppData/codelab/workspace:/workspace
      - /DATA/AppData/codelab/config:/var/lib/codelab/config:ro

    depends_on:
      codelab-postgres:
        condition: service_healthy

    networks:
      - codelab


  codelab-app-manager:
    image: ghcr.io/lucasrtn/codelab-app-manager:latest
    container_name: codelab-app-manager
    restart: unless-stopped

    # Durcissement. SETUID/SETGID sont indispensables ici : c'est ce qui
    # permet a drop_privileges() de faire tomber chaque application sur son
    # propre uid. Les retirer ne durcirait rien, cela DESACTIVERAIT
    # l'isolation des applications.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    ports:
      - "9001:9001"
      # Les applications deployees sont servies ICI, sur un port a part -- donc
      # dans une origine differente de celle du panneau. C'est ce qui empeche
      # une faille dans une application d'atteindre le panneau : le navigateur
      # traite deux ports comme deux sites, et refuse a l'un de lire l'autre.
      # Sans ce port publie, le panneau s'en apercoit, le dit dans
      # Parametres > Serveur, et continue de servir les applications lui-meme.
      - "9002:9002"

    volumes:
      - /DATA/AppData/codelab/app-manager:/var/lib/codelab/app-manager
      - /DATA/AppData/codelab/workspace:/workspace
      # Lecture-ecriture (pas ":ro") : ce service ajoute sa propre ligne
      # dans le credentials.env consolide partage avec codelab-postgres.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    environment:
      APP_MANAGER_STATE: /var/lib/codelab/app-manager
      APP_MANAGER_ROOT: /workspace
      MANAGER_PORT: "9001"
      APP_MANAGER_SHARED_CONFIG: /var/lib/codelab/config

      # --- Le jour ou ce panneau sort de ton reseau ---------------------
      # RIEN A DECOMMENTER ICI dans le cas courant : ces trois reglages se
      # posent depuis le panneau, Parametres > Serveur. Marche a suivre
      # complete dans le README, section « Sortir de chez toi » (et
      # app-manager/vps/ pour la variante avec un VPS devant).
      #
      # Les cases de la page refusent de s'activer tant que la situation ne
      # les justifie pas -- HTTPS seulement depuis une page deja en https,
      # le proxy seulement si un en-tete X-Forwarded-* est reellement la.
      # C'est ce qui evite les deux pieges d'autrefois : un cookie "Secure"
      # pose trop tot, que le navigateur cesse d'envoyer en clair et qui
      # faisait tomber la session sans retour ; et un X-Forwarded-For cru
      # sur un panneau publie en direct, ou n'importe quel client annonce
      # l'adresse qu'il veut et contourne la limite de tentatives.
      #
      # Les lignes ci-dessous restent lues et PRIORITAIRES : posees ici,
      # elles grisent la case correspondante. C'est la marche arriere qui ne
      # depend pas du panneau, utile si un reglage le rend inatteignable.
      #
      # APP_MANAGER_HTTPS: "1"
      # APP_MANAGER_TRUST_PROXY: "1"
      # APP_MANAGER_PUBLIC_URL: "https://codelab.tondomaine.fr"

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - codelab


  # Reverse proxy authentifiant devant Dagster. Dagster (edition open source)
  # n'a AUCUNE authentification : qui atteint son port peut lancer un job,
  # donc executer du code arbitraire sur la machine. Le port 3000 de l'hote
  # arrive donc ici, et le port de codelab-dagster n'est plus publie -- il
  # n'est joignable que depuis le reseau interne de la stack.
  codelab-dagster-proxy:
    image: ghcr.io/lucasrtn/codelab-dagster-proxy:latest
    container_name: codelab-dagster-proxy
    restart: unless-stopped

    # nginx : le maitre demarre en root pour lire sa configuration et ouvrir
    # son port, puis les workers tournent en "nginx". Rien d'autre.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    ports:
      - "3000:3000"

    volumes:
      # Lecture-ecriture : ce service ajoute son propre bloc (identifiants
      # d'acces a Dagster) dans le credentials.env partage.
      - /DATA/AppData/codelab/config:/var/lib/codelab/config

    depends_on:
      - codelab-dagster

    healthcheck:
      # 401 attendu sans identifiants : c'est la preuve que nginx repond ET
      # que l'authentification est bien en place. Un 200 ici signifierait
      # qu'elle est tombee.
      # Sonde dediee, hors du chemin authentifie : une requete sur "/" sans
      # session redirige maintenant vers le panneau, et wget suivrait cette
      # redirection vers un hote absent de ce conteneur.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/_sante"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - codelab


networks:
  codelab:
    name: codelab_codelab
