# Epingler les actions par SHA (voir workflows/build-images.yml) les fige :
# sans quelqu'un pour proposer la montee de version, on garderait
# indefiniment une version vulnerable. C'est ce fichier, ce quelqu'un.
#
# Dependabot lit le commentaire " # v4" qui suit chaque SHA, ouvre une PR
# quand une nouvelle version sort, et met a jour le SHA ET le commentaire.
# La PR passe par la CI comme une autre : les tests d'abord, puis la
# construction des sept images sans publication.
#
# Trois ecosystemes, et c'est delibere :
#
#   github-actions  ce qui s'execute dans la CI avec un jeton d'ecriture sur
#                   le registre. C'est le seul endroit ou du code tiers
#                   touche a la publication des images.
#   docker          les images de base des sept Dockerfiles. Elles restent
#                   volontairement referencees par tag (postgres:18,
#                   python:3.13-slim) pour continuer de recevoir les
#                   correctifs a chaque reconstruction ; Dependabot signale
#                   ici les montees de version majeures, celles qu'un tag ne
#                   donne pas.
#
#   pip             les dependances du panneau (app-manager/requirements.txt),
#                   celui qui detient les secrets : une faille corrigee en
#                   amont doit arriver jusqu'ici sans attendre qu'on y pense.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app-manager
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Panneau"
    labels:
      - dependances

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "CI"
    labels:
      - dependances

  - package-ecosystem: docker
    directories:
      - /postgres
      - /redis
      - /mailpit
      - /dev
      - /dagster
      - /dagster/proxy
      - /app-manager
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Images"
    labels:
      - dependances
