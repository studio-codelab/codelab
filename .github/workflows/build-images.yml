name: Build & push CodeLab images

# Deux declencheurs distincts :
#
#   1. Push sur main touchant un dossier de service -> reconstruit et publie
#      en "latest" + SHA court. C'est le flux courant, pour du developpement.
#
#   2. Tag Git au format "vX.Y.Z" (ex. v1.0.0) -> reconstruit et publie les
#      images EN MEME TEMPS, toutes avec ce meme numero de version
#      (ghcr.io/studio-codelab/codelab-<service>:1.0.0). CodeLab est distribue
#      comme un tout : tous les services sortent ensemble, jamais versionnes
#      independamment. "latest" n'est pas touche par un tag de version.
#
# Sur un push ou une pull request, seules les images touchees se
# reconstruisent (job « changements ») : le depot est prive, sur le plan
# gratuit, et ses 2 000 minutes par mois ne tenaient pas sept images a
# chaque push.
on:
  push:
    branches: [main]
    paths:
      - "postgres/**"
      - "redis/**"
      - "mailpit/**"
      - "dev/**"
      - "dagster/**"
      - "workspace/**"
      - "app-manager/**"
      - "docker-compose.yml"
      - "docker-compose-casaos.yml"
      - ".github/workflows/build-images.yml"
    tags:
      - "v*.*.*"
  # Sur une pull request : on construit sans publier. Sans ce declencheur, un
  # Dockerfile casse ne se voyait qu'apres la fusion, sur main -- c'est-a-dire
  # au moment ou l'image "latest" ne se construit plus.
  pull_request:
    paths:
      - "postgres/**"
      - "redis/**"
      - "mailpit/**"
      - "dev/**"
      - "dagster/**"
      - "workspace/**"
      - "app-manager/**"
      - "docker-compose.yml"
      - "docker-compose-casaos.yml"
      - ".github/workflows/build-images.yml"
  # Reconstruction hebdomadaire, meme sans commit.
  #
  # Les images de base restent volontairement referencees par tag
  # (python:3.13-slim, postgres:18) : un digest fige bloquerait les correctifs
  # de securite au lieu de les recevoir. Mais un tag ne sert a rien si l'image
  # n'est jamais RECONSTRUITE -- sans commit pendant deux mois, "latest" est
  # figee sur les paquets d'il y a deux mois, digest ou pas. C'est le vrai
  # trou que l'audit visait sans le nommer.
  #
  # Lundi 5 h UTC, une heure avant le scan de securite : les images sont
  # fraiches quand Trivy les regarde, et ce qu'il signale est ce qui reste
  # ouvert APRES reconstruction -- donc ce sur quoi il faut vraiment agir.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

# Les actions sont epinglees par SHA de commit, pas par tag. Un tag se
# redeplace : "@v4" designe ce que son proprietaire y met aujourd'hui, et une
# action compromise s'executerait ici avec le jeton d'ecriture sur le
# registre. Un SHA ne bouge pas.
#
# Le commentaire " # v4" qui suit chaque SHA n'est pas decoratif : c'est ce
# que Dependabot lit pour proposer la montee de version, et ce qui rend le
# fichier relisible. Epingler SANS Dependabot ne ferait que figer des
# versions vulnerables -- les deux vont ensemble ou ne se font pas
# (.github/dependabot.yml).

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Les tests d'abord : ils tournent en quelques secondes, et rien ne sert de
  # construire quatre images multi-architecture si la detection de stack ou
  # l'authentification du panneau est cassee.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Meme version que celle de l'image app-manager (voir son Dockerfile).
      # Tester sur un interpreteur different de celui qui sera livre revient a
      # ne pas tester ce qu'on livre.
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # webauthn et qrcode sont la pour une raison precise : sans elles, des
      # tests s'IGNORENT au lieu d'echouer -- pytest.skip, vert au tableau de
      # bord, et personne ne voit qu'un pan entier n'est plus couvert.
      #
      # Mesure du jour ou elles ont ete ajoutees : cinq tests ne tournaient
      # pas faute de webauthn (toute la section des cles d'acces, muette
      # depuis son introduction), et deux faute de qrcode -- dont celui qui
      # verifie qu'aucun secret ne sort dans l'URL du QR code.
      #
      # REGLE : ce que l'image embarque, la CI l'installe. Les versions sont
      # alignees sur app-manager/Dockerfile -- tester une autre version que
      # celle qu'on livre ne prouve pas grand-chose. En ajouter une ici sans
      # l'ajouter la-bas, ou l'inverse, remet des tests en sommeil.
      #
      # pyyaml est la SEULE exception, et elle va dans l'autre sens : c'est un
      # outil de TEST, pas une dependance du panneau, et il n'a donc rien a
      # faire dans app-manager/Dockerfile. Il etait absent, et deux tests qui
      # relisent les composes se contentaient de ne rien verifier ici -- dont
      # celui qui tient la regle « environment: l'emporte sur env_file: »,
      # exactement le genre de piege muet qu'une suite doit attraper en CI et
      # pas seulement sur le poste de celui qui l'ecrit.
      - name: Dependances
        run: pip install flask psutil pytest webauthn==3.0.0 qrcode==8.2 cryptography==50.0.1 pyyaml

      # La suite vit dans workspace/diagnostic/tests/, separee des sondes de
      # checks.py : celles-ci tournent en production, dans des images qui
      # n'embarquent pas pytest.
      #
      # -rs liste les tests ignores dans le journal. Sans cette ligne, un saut
      # ne laisse qu'un "s" au milieu des points : cinq tests de regression du
      # panneau se sont ignores pendant des semaines parce que la recherche
      # des sources visait app-manager/app.py alors que le panneau vit dans
      # app-manager/app/app.py. Vert au tableau de bord, rien de verifie.
      - name: pytest
        run: CODELAB_REPO_ROOT=$GITHUB_WORKSPACE python -m pytest workspace/diagnostic/tests -q -rs

  # QUELLES IMAGES CONSTRUIRE. Vecu : « The job was not started because
  # [...] your spending limit needs to be increased ». Le depot est prive, sur
  # le plan gratuit : 2 000 minutes par mois, et le plafond de depenses a 0 €.
  # Chaque push reconstruisait les sept images (et les deux architectures sur
  # main, l'arm64 emule par QEMU) : une journee de travail epuisait le mois.
  #
  # Une image ne se reconstruit plus que si un fichier qu'elle COPIE a change
  # (la table ci-dessous ; un test verifie qu'elle couvre chaque COPY de
  # chaque Dockerfile). Tout se reconstruit quand ce fichier change, sur un
  # tag de version, chaque lundi (les correctifs des images de base) et a la
  # demande.
  #
  # ESSAYE ET ECARTE : ne plus construire du tout sur une pull request. Un
  # Dockerfile casse ne se verrait qu'apres la fusion, au moment ou « latest »
  # ne se construit plus ; construire seulement ce qui change garde la
  # garantie pour une fraction du prix.
  changements:
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.choix.outputs.matrice }}
      nombre: ${{ steps.choix.outputs.nombre }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Images touchees
        id: choix
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_PR: ${{ github.base_ref }}
          AVANT: ${{ github.event.before }}
          TYPE_REF: ${{ github.ref_type }}
        # Une image par ligne : son nom, son Dockerfile, puis les debuts de
        # chemin qui la font reconstruire (ce que son Dockerfile copie).
        run: |
          ici="${RUNNER_TEMP:-/tmp}"
          cat > "$ici/images.txt" <<'FIN'
          codelab-postgres postgres/Dockerfile postgres/
          codelab-redis redis/Dockerfile redis/
          codelab-mailpit mailpit/Dockerfile mailpit/
          codelab-dev dev/Dockerfile dev/ postgres/proteger-base.sql
          codelab-dagster dagster/Dockerfile dagster/Dockerfile dagster/dagster.yaml dagster/entrypoint.sh dagster/lancer.sh dagster/isolation.py workspace/
          codelab-dagster-proxy dagster/proxy/Dockerfile dagster/proxy/ app-manager/app/polices/
          codelab-app-manager app-manager/Dockerfile app-manager/ postgres/proteger-base.sql
          FIN
          tout=non
          if [ "$EVENEMENT" = pull_request ]; then
            git diff --name-only "origin/$BASE_PR...HEAD" > "$ici/touches.txt"
          elif [ "$EVENEMENT" = push ] && [ "$TYPE_REF" != tag ] \
               && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            git diff --name-only "$AVANT" HEAD > "$ici/touches.txt"
          else
            tout=oui
            : > "$ici/touches.txt"
          fi
          grep -qx ".github/workflows/build-images.yml" "$ici/touches.txt" && tout=oui
          python3 - "$tout" "$ici" <<'FIN'
          import json, os, sys
          tout, ici = sys.argv[1] == "oui", sys.argv[2]
          touches = [l.strip() for l in open(ici + "/touches.txt") if l.strip()]
          choisies = []
          for ligne in open(ici + "/images.txt"):
              nom, dockerfile, *chemins = ligne.split()
              if tout or any(t.startswith(c) for t in touches for c in chemins):
                  choisies.append({"name": nom, "dockerfile": dockerfile})
          print("images :", ", ".join(i["name"] for i in choisies) or "aucune")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrice=" + json.dumps({"include": choisies}) + "\n")
              f.write(f"nombre={len(choisies)}\n")
          FIN

  build:
    needs: [tests, changements]
    if: needs.changements.outputs.nombre != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changements.outputs.matrice) }}
    env:
      # Les architectures publiees. Une seule suffit si le serveur est un PC
      # classique : poser la variable du depot CODELAB_PLATEFORMES a
      # « linux/amd64 » (Settings > Secrets and variables > Actions >
      # Variables) divise encore le temps par deux ou plus, l'arm64 etant
      # emule. Sur une pull request : amd64 seulement, on verifie que le
      # Dockerfile se construit, pas qu'il se construit deux fois.
      PLATEFORMES: ${{ github.event_name == 'pull_request' && 'linux/amd64' || vars.CODELAB_PLATEFORMES || 'linux/amd64,linux/arm64' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: QEMU (pour les builds arm64 sur runner amd64)
        if: contains(env.PLATEFORMES, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Une pull request venant d'un fork n'a pas de jeton d'ecriture sur le
      # registre, et on ne publie de toute facon rien depuis une PR.
      - name: Connexion a ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La version gravee dans l'image : le commit construit et sa date. Le
      # panneau la compare a la derniere image publiee (Parametres > Compte).
      - name: Version
        id: version
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Metadonnees / tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type != 'tag' }}
            type=sha,format=short,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}

      # Contexte = racine du repo : les Dockerfiles font
      # "COPY dev/entrypoint.sh", "COPY workspace", etc., des chemins
      # relatifs a la racine, pas a leur propre dossier.
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATEFORMES }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODELAB_VERSION=${{ github.sha }}
            CODELAB_VERSION_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
