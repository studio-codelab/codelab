# codelab-litellm -- le routage, et rien d'autre.
#
# Repartition des roles, pour que personne n'ait a la deviner :
#
#   codelab-llm      identite CodeLab, quota par personne, comptabilite en base
#   codelab-litellm  choix du fournisseur, repli, cles des fournisseurs
#
# Ce service ne compte donc PAS la consommation : codelab-llm le fait deja,
# en base, par utilisateur et par application. Deux comptabilites qui se
# contredisent valent moins qu'une seule a laquelle on se fie -- c'est aussi
# pourquoi aucune base n'est branchee ici (« database_url » absent), ce qui
# evite une migration de schema a chaque montee de version.
#
# LES NOMS LOGIQUES sont le contrat avec les clients : un editeur ou une
# application demande « codelab-coding », jamais un nom de fournisseur.
# Changer de modele se fait ICI, sans toucher a un seul client.
#
# LES CLES ne sont lues que dans l'environnement du conteneur (os.environ/...)
# et n'apparaissent jamais dans ce fichier, qui est versionne.
#
# Les identifiants de modeles ci-dessous sont un POINT DE DEPART : verifier
# qu'ils correspondent a ce que le fournisseur sert le jour de l'installation,
# et ajuster. Une valeur inexacte se voit au premier appel (404 du
# fournisseur), pas au demarrage.

model_list:
  # Le modele de travail : celui que l'agent de developpement utilise.
  - model_name: codelab-coding
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Le rapide : les taches courtes, les reformulations, le peu couteux.
  - model_name: codelab-fast
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  # Le raisonnement : ce qu'on accepte de payer plus cher et d'attendre.
  - model_name: codelab-reasoning
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Le local : aucun jeton ne sort de la machine. Sans serveur Ollama
  # joignable, ce nom repond en erreur -- c'est voulu, il ne se replie pas
  # silencieusement sur un fournisseur distant, ce qui ferait sortir des
  # donnees qu'on gardait ici exprès.
  - model_name: codelab-local
    litellm_params:
      model: ollama/llama3.1
      api_base: os.environ/OLLAMA_BASE_URL

router_settings:
  # Le repli ne traverse JAMAIS la frontiere du local : codelab-local n'a pas
  # de fallback, et aucun fallback ne pointe vers lui.
  fallbacks:
    - codelab-coding: ["codelab-fast"]
    - codelab-reasoning: ["codelab-coding"]
  num_retries: 2
  # Un appel qui n'a pas abouti en deux minutes ne servira plus a personne :
  # l'editeur en face a deja rendu la main.
  timeout: 120

general_settings:
  # La cle maitresse : la SEULE facon d'entrer ici. Elle est partagee avec
  # codelab-llm, qui est le seul service a voir ce conteneur (reseau
  # codelab-ia). Vide, personne n'entre.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # Ni prompts ni reponses dans les journaux. Le contenu des echanges
  # appartient au client qui les mene ; ce service route, il n'archive pas.
  turn_off_message_logging: true
  drop_params: true
