# Le portier d'Open WebUI.
#
# Meme role, meme forme et meme raison que celui de Dagster : l'application
# derriere n'a pas d'authentification qui nous convienne, donc personne ne
# l'atteint sans etre passe par la session CodeLab. La difference tient en un
# point : Open WebUI diffuse ses reponses au fil de l'eau et ouvre des
# WebSockets, ce que le proxy du panneau (urllib, requete par requete) ne sait
# pas relayer. D'ou nginx.
events {}

http {
  # WebSocket : nginx doit relayer l'en-tete Upgrade, et seulement quand il
  # est la. Une valeur "close" sur une requete ordinaire evite de garder des
  # connexions ouvertes pour rien.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 3001;
    server_name _;

    # Les pieces jointes d'Open WebUI passent par la : 1 Mo par defaut
    # refuserait la premiere image deposee.
    client_max_body_size 50m;

    # La question posee au panneau avant CHAQUE requete : cette session
    # est-elle valide, et qui est-ce ? Le panneau repond 200 + les en-tetes
    # d'identite, ou 401.
    location = /_codelab_auth {
      internal;
      proxy_pass http://codelab-app-manager:9001/api/sso-check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }

    # Sans session : on renvoie vers la page de connexion du panneau plutot
    # qu'un 401 nu. C'est la meme porte que pour le reste de CodeLab.
    error_page 401 = @connexion;
    location @connexion {
      return 302 http://$host:9001/login;
    }

    location / {
      auth_request /_codelab_auth;

      auth_request_set $codelab_user  $upstream_http_x_codelab_user;
      auth_request_set $codelab_email $upstream_http_x_codelab_email;
      auth_request_set $codelab_role  $upstream_http_x_codelab_role;

      proxy_pass http://codelab-open-webui:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # L'IDENTITE VIENT D'ICI, ET DE NULLE PART AILLEURS. Ces trois lignes
      # ECRASENT ce que le navigateur aurait pu envoyer sous les memes noms :
      # sans elles, n'importe qui se declarerait administrateur en ajoutant
      # un en-tete a sa requete.
      proxy_set_header X-CodeLab-User  $codelab_user;
      proxy_set_header X-CodeLab-Email $codelab_email;
      proxy_set_header X-CodeLab-Role  $codelab_role;

      # Streaming SSE et WebSocket : sans cela, nginx garde la reponse en
      # tampon et le texte arrive d'un bloc a la fin -- l'interface parait
      # figee pendant toute la generation.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
  }
}
