events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 3001;
    server_name _;

    client_max_body_size 50m;

    location = /_codelab_auth {
      internal;
      proxy_pass http://codelab-app-manager:9001/api/sso-check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }

    location / {
      auth_request /_codelab_auth;

      auth_request_set $codelab_user $upstream_http_x_codelab_user;
      auth_request_set $codelab_email $upstream_http_x_codelab_email;
      auth_request_set $codelab_role $upstream_http_x_codelab_role;

      proxy_pass http://codelab-open-webui:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Open WebUI trusted-header SSO: les valeurs envoyees par le navigateur
      # ne passent jamais, nginx les remplace par celles de /api/sso-check.
      proxy_set_header X-CodeLab-User $codelab_user;
      proxy_set_header X-CodeLab-Email $codelab_email;
      proxy_set_header X-CodeLab-Role $codelab_role;

      # Streaming SSE et WebSocket.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
  }
}
