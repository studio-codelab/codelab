model_list:
  - model_name: codelab-fast
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
  - model_name: codelab-fast-gemini
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: codelab-smart
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: codelab-smart-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: codelab-smart-openrouter
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-001
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: codelab-coding
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: codelab-coding-gemini
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  fallbacks:
    - codelab-fast: [codelab-fast-gemini]
    - codelab-smart: [codelab-smart-groq, codelab-smart-openrouter]
    - codelab-coding: [codelab-coding-gemini, codelab-smart]
  request_timeout: 90
  num_retries: 2
  retry_after: 1
  json_logs: true
